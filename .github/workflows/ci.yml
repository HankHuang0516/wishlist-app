name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  client-checks:
    name: Client Test & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./client

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test -- --run

    - name: Build
      run: npm run build

  server-checks:
    name: Server Test & Typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: wishlist_marketplace_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/wishlist_marketplace_test_ci
      TEST_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/wishlist_marketplace_test_ci

    defaults:
      run:
        working-directory: ./server

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Build compiled production modules for lifecycle tests
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Test restricted source sync and private receipt verification
      run: node --test scripts/source-sync-once.test.cjs scripts/source-sync-receipt-check.test.cjs

    - name: Test local MiniMax vision pilot without account access
      run: node --test ../tools/minimax-vision-bridge/server.test.mjs

    - name: Test marketing photo preservation without provider access
      run: node --test ../tools/minimax-vision-bridge/marketing-compose.test.mjs

    - name: Test authorized private feed bridge without partner access
      run: node --test ../tools/authorized-feed-bridge/poller.test.mjs

    - name: Verify authorized feed cron image remains dormant
      working-directory: .
      run: node tools/authorized-feed-bridge/verify-cron-image.mjs

    - name: Verify native QA photo identity checks
      run: node --test ../mobile/scripts/check-native-qa-photo-fingerprint.cjs

    - name: Prevent incomplete App Review demo and business submissions
      run: node --test ../scripts/app-review-preflight.test.cjs

    - name: Refuse unsafe database configuration before migrations
      run: node ../scripts/assert-test-database.cjs

    - name: Apply migrations to isolated database
      run: npx prisma migrate deploy

    - name: Verify schema and database agree
      run: npx prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

    - name: Install actual Web for isolated browser tests
      run: npm ci --prefix ../client

    - name: Build actual Web for isolated browser tests
      run: npm run build --prefix ../client

    - name: Install Traditional Chinese browser fonts
      run: |
        sudo apt-get update
        sudo apt-get install --yes fonts-noto-cjk python3-pil
        fc-match -f '%{family}\\n' 'Noto Sans CJK TC'

    - name: Real marketplace HTTP and database tests
      env:
        WEB_QA_ARTIFACT_DIR: ${{ github.workspace }}/qa-artifacts
        EXPLORE_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: npm test -- --config jest.marketplace.config.js --runInBand

    - name: Preserve isolated Explore browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: explore-browser-${{ github.sha }}
        path: qa-artifacts/explore-counts-*
        if-no-files-found: error
        retention-days: 14

    - name: Preserve actual Web build icons for release review
      uses: actions/upload-artifact@v4
      with:
        name: explore-web-icons-${{ github.sha }}
        path: |
          client/dist/logo.png
          client/dist/pwa-icon-512.png
          client/dist/pwa-icon-192.png
          client/dist/apple-touch-icon.png
          client/icon-source/original-no-H.png
          client/icon-source/general-H.png
          client/icon-source/recipe.json
          client/icon-source/README.md
        if-no-files-found: error
        retention-days: 14

    - name: Generate isolated H placement candidates for visual review
      env:
        ICON_CANDIDATE_DIR: ${{ github.workspace }}/qa-icon-candidates
      run: /usr/bin/python3 ../client/scripts/generate-web-icon-candidates.py

    - name: Preserve isolated H candidates
      uses: actions/upload-artifact@v4
      with:
        name: explore-icon-candidates-${{ github.sha }}
        path: qa-icon-candidates
        if-no-files-found: error
        retention-days: 14

  mobile-checks:
    name: Native App Typecheck and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: node --test scripts/check-ios-xctestrun-config.cjs
    - run: npx expo install --check
