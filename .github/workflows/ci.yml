name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  client-checks:
    name: Client Test & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./client

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test -- --run

    - name: Build
      run: npm run build

  server-checks:
    name: Server Test & Typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: wishlist_marketplace_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/wishlist_marketplace_test_ci
      TEST_DATABASE_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/wishlist_marketplace_test_ci

    defaults:
      run:
        working-directory: ./server

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Build compiled production modules for lifecycle tests
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Test restricted source sync and private receipt verification
      run: node --test scripts/source-sync-once.test.cjs scripts/source-sync-receipt-check.test.cjs scripts/records-bridge.test.cjs

    - name: Test bounded LINE desktop observations
      run: node --test ../tools/source-pipeline/line-read-budget.test.mjs

    - name: Test relay identity compatibility and rejected-send stop
      run: node --test ../tools/inquiry-relay/relay-identity.test.cjs

    - name: Test local MiniMax vision pilot without account access
      run: node --test ../tools/minimax-vision-bridge/server.test.mjs

    - name: Test marketing photo preservation without provider access
      run: node --test ../tools/minimax-vision-bridge/marketing-compose.test.mjs

    - name: Test authorized private feed bridge without partner access
      run: node --test ../tools/authorized-feed-bridge/poller.test.mjs

    - name: Verify authorized feed cron image remains dormant
      working-directory: .
      run: node tools/authorized-feed-bridge/verify-cron-image.mjs

    - name: Verify native QA photo identity checks
      run: node --test ../mobile/scripts/check-native-qa-photo-fingerprint.cjs

    - name: Prevent incomplete App Review demo and business submissions
      run: node --test ../scripts/app-review-preflight.test.cjs

    - name: Refuse unsafe database configuration before migrations
      run: node ../scripts/assert-test-database.cjs

    - name: Apply migrations to isolated database
      run: npx prisma migrate deploy

    - name: Verify schema and database agree
      run: npx prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

    - name: Install actual Web for isolated browser tests
      run: npm ci --prefix ../client

    - name: Build actual Web for isolated browser tests
      id: query_web_build
      run: npm run build --prefix ../client

    - name: Install Traditional Chinese fonts for query evidence review
      if: always()
      timeout-minutes: 5
      run: |
        # Runner package lists are pre-populated. Avoid refreshing unrelated
        # third-party repositories unless the required package cannot install.
        install_fonts() {
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fonts-noto-cjk
        }
        if ! install_fonts; then
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          install_fonts
        fi
        fc-list :lang=zh-tw family | grep -q 'Noto.*CJK'

    - name: Real marketplace HTTP and database tests
      run: npm test -- --config jest.marketplace.config.js --runInBand
      env:
        WEB_QA_ARTIFACT_DIR: ${{ github.workspace }}/qa-query-artifacts
        QUERY_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Test existing built Explore while icon metadata blocks release
      if: failure() && steps.query_web_build.outcome == 'failure'
      run: npm test -- --config jest.marketplace.config.js --runInBand exploreEvidenceBrowser.integration
      env:
        WEB_QA_ARTIFACT_DIR: ${{ github.workspace }}/qa-query-artifacts
        QUERY_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Test actual source manager while release icon inspection is pending
      if: failure() && steps.query_web_build.outcome == 'failure'
      run: npm test -- --config jest.marketplace.config.js --runInBand 'sourceManager|sourceReferenceAuto|sourceReferenceRegistry'
      env:
        WEB_QA_ARTIFACT_DIR: ${{ github.workspace }}/qa-query-artifacts
        QUERY_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Preserve actual release icon bytes for review
      if: always()
      run: |
        node - <<'NODE'
        const fs=require('fs'),path=require('path'),crypto=require('crypto');
        const out=process.env.GITHUB_WORKSPACE+'/qa-query-artifacts';fs.mkdirSync(out,{recursive:true});
        const client=path.resolve('../client'),recipe=JSON.parse(fs.readFileSync(path.join(client,'icon-source/recipe.json')));
        const version=JSON.parse(fs.readFileSync(path.join(client,'package.json'))).version;
        const outputs={},inputs={},hash=b=>crypto.createHash('sha256').update(b).digest('hex');
        for(const [name,expected] of Object.entries(recipe.outputs)){const p=path.join(client,'dist',name);if(!fs.existsSync(p))throw Error('Actual built icon missing: '+name);const bytes=fs.readFileSync(p);outputs[name]={sha256:hash(bytes),matchesRecipe:hash(bytes)===expected.sha256};fs.writeFileSync(path.join(out,'query-built-'+name),bytes);}
        for(const key of ['original','H']){const bytes=fs.readFileSync(path.join(client,'icon-source',recipe[key].path));inputs[key]={sha256:hash(bytes),matchesRecipe:hash(bytes)===recipe[key].sha256};fs.writeFileSync(path.join(out,'query-icon-input-'+key+'.png'),bytes);}
        fs.writeFileSync(path.join(out,'query-build-icons.json'),JSON.stringify({version,head:process.env.QUERY_HEAD,actualBuildBytes:true,visualReviewClaim:false,outputs,inputs},null,2));
        if(Object.values(outputs).concat(Object.values(inputs)).some(x=>!x.matchesRecipe))throw Error('Fixed icon bytes differ');
        NODE
      env:
        QUERY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Preserve isolated Explore query evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: query-evidence-${{ github.sha }}
        path: qa-query-artifacts/query-*
        if-no-files-found: error
        retention-days: 14

  mobile-checks:
    name: Native App Typecheck and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: mobile/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: node --test scripts/check-ios-xctestrun-config.cjs
    - run: npx expo install --check
