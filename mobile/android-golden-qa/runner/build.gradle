plugins { id 'com.android.application' }
def label = providers.gradleProperty('goldenTestLabel').getOrElse('')
if (!(label ==~ /[0-9]{12}/)) throw new GradleException('Explicit fresh Golden test label required')
android {
    namespace 'com.hankhuang.wishlistgoldenqa'
    compileSdk 36
    defaultConfig {
        applicationId "com.hankhuang.wishlistgoldenqa.qa${label}"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName 'local-regression-only'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
